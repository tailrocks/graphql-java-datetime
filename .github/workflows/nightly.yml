# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: Nightly
run-name: Nightly · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        required: false
        default: both
        type: choice
        options:
          - velnor
          - github
          - both
      scope:
        description: Verification scope
        required: true
        default: full
        type: choice
        options:
          - affected
          - full
      base_sha:
        description: Git ref or SHA used as the affected-selection base
        required: false
        default: refs/heads/main
        type: string
      simulate_failure:
        description: Force the red-to-signal test path
        required: false
        default: false
        type: boolean


concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  dispatch-ci-main:
    name: "Control / Dispatch ci-main"
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.simulate_failure }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch ci-main on default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: main
          DISPATCH_RUNNER: ${{ github.event.inputs.runner || 'both' }}
          DISPATCH_SCOPE: ${{ github.event.inputs.scope || 'full' }}
          DISPATCH_BASE_SHA: ${{ github.event.inputs.base_sha || format('refs/heads/{0}', github.event.repository.default_branch) }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci-main.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f runner="$DISPATCH_RUNNER" \
            -f scope="$DISPATCH_SCOPE" \
            -f base_sha="$DISPATCH_BASE_SHA"
  nightly-red-to-signal:
    name: "Control / Nightly red-to-signal"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Simulate nightly failure
        shell: bash
        run: |
          set -euo pipefail
          echo "nightly red-to-signal simulation requested" >&2
          exit 1
  nightly-alert:
    name: "Control / Nightly red-to-signal"
    if: ${{ always() && needs.nightly-red-to-signal.result == 'failure' }}
    needs: [nightly-red-to-signal]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update nightly failure signal
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_RESULT: ${{ needs.nightly-red-to-signal.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NIGHTLY_RESULT" == success ]]; then
            exit 0
          fi
          echo "::error::nightly-red-to-signal failed: $NIGHTLY_RESULT"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open" --jq '.[] | select(.title == "Nightly CI red") | .number' | sed -n '1p')"
          body="$(printf '%s\n%s\n' \
            "nightly-red-to-signal result: $NIGHTLY_RESULT" \
            "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$existing" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues" -f title='Nightly CI red' -f body="$body" >/dev/null
          fi
