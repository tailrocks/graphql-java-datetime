    name: "Gradle · Gradle"
    if: ${{ always() && needs.plan.result == 'success' && contains(format(',{0},', needs.plan.outputs.units), ',gradle,') }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-gradle.yml
